<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zcode-hub · 着色器工单</title>
  <link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
  <style>
    .wo-status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
    .st-queued{background:rgba(120,140,255,.15);color:#8ea2ff}
    .st-dispatched{background:rgba(255,180,60,.15);color:#ffb43c}
    .st-done{background:rgba(60,180,120,.15);color:#3cb478}
    .st-failed{background:rgba(230,80,80,.15);color:#e65050}
    .st-cancelled{background:rgba(150,150,150,.15);color:#999}
    .wo-table{width:100%;border-collapse:collapse;font-size:13px}
    .wo-table th,.wo-table td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
    .wo-table th{color:var(--muted,#8b93a7);font-weight:600;white-space:nowrap}
    .wo-note{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted,#8b93a7)}
    .wo-form input,.wo-form textarea{width:100%;box-sizing:border-box;margin-bottom:8px}
    .wo-form .row2{display:flex;gap:8px}
    .wo-form .row2>*{flex:1}
    .sup-line{margin-bottom:12px}
  </style>
</head>
<body>
<div id="admin-header" data-active="/admin/burner"></div>

<main class="admin-main">
  <div class="page-hd">
    <div>
      <div class="page-title">着色器工单</div>
      <div class="page-sub">zburn 队列语义 · 派单走 _sup 文件通道（Stop 钩子一次性消费）· 验收看 watch 文件 + verify 命令</div>
    </div>
    <div class="page-actions">
      <span class="live-dot" id="live-dot">5s 轮询</span>
      <button onclick="dispatchNow()" class="page-action-btn">立即派单</button>
      <button onclick="clearDone()" class="page-action-btn">清已完成</button>
    </div>
  </div>

  <div class="settings-card" id="supervisor-line">
    <div class="hint" style="margin-bottom:0">续派总闸加载中…</div>
  </div>

  <div class="settings-card" id="enqueue-card">
    <div class="section-title" style="margin-bottom:8px">入队新工单</div>
    <div class="wo-form">
      <input class="input" id="wo-title" placeholder="工单标题，例：铁道后十景全链">
      <textarea class="input" id="wo-prompt" rows="4"
        placeholder="工单指令（写清「完成后停下」，否则回合结束钩子只会执行这一次）"></textarea>
      <div class="row2">
        <input class="input" id="wo-watch" placeholder="watch 文件（逗号分隔，可选）——变化才触发验收">
        <input class="input" id="wo-verify" placeholder="verify 命令（可选，exit 0 = 通过）">
      </div>
      <div class="row2">
        <input class="input" id="wo-cwd" placeholder="verify 工作目录（可选）">
        <input class="input" id="wo-retries" type="number" min="0" value="1" placeholder="失败重试次数">
      </div>
      <button class="btn btn-primary" onclick="enqueue()">入队</button>
    </div>
  </div>

  <div class="settings-card" id="queue-card">
    <div class="section-title" style="margin-bottom:8px">工单队列</div>
    <div id="queue-body"><div class="hint">加载中…</div></div>
  </div>
</main>

<script src="/static/js/auth.js?v={{APP_VERSION}}"></script>
<script src="/static/js/toast.js?v={{APP_VERSION}}"></script>
<script src="/static/js/header.js?v={{APP_VERSION}}"></script>
<script>
let _timer=null, _snap=null;

(async()=>{
  await renderAdminHeader();
  const key=await adminKey.get();
  if(!key||!await verifyKey(ADMIN_API+'/verify',key).catch(()=>false))return location.href='/admin/login';
  await load();
  _timer=setInterval(()=>{ if(!document.hidden) load(true); },5000);
})();

const ST_LABEL={queued:'排队',dispatched:'执行中',done:'完成',failed:'失败',cancelled:'已取消'};

async function load(silent){
  try{
    _snap=await api('GET','/burner');
    renderSup();
    renderQueue();
  }catch(e){ if(!silent)showToast('加载失败: '+e.message,'error'); }
}

function renderSup(){
  const box=document.getElementById('supervisor-line');
  if(!box)return;
  const s=_snap||{};
  box.innerHTML=`<div class="hint" style="margin-bottom:0">续派总闸：
    <b style="color:${s.enabled?'#3cb478':'#e65050'}">${s.enabled?'开启':'关闭'}</b>
    （总闸关=只展示不派单；开/关去 <a href="/admin/settings">设置页</a> 的「续派监督」卡片）
    ｜待发指令：${s.promptPending?'<b>在途（回合结束即消费）</b>':'无'}
    ｜轮询：${s.poller&&s.poller.running?'运行中':'停止'}</div>`;
}

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderQueue(){
  const box=document.getElementById('queue-body');
  if(!box)return;
  const orders=(_snap&&_snap.queue)||[];
  if(!orders.length){box.innerHTML='<div class="hint">队列空——用上面的表单入队，或「立即派单」试试。</div>';return;}
  const rows=orders.map(o=>{
    const t=o.dispatchedAt||o.at;
    const time=t?new Date(t*1000).toLocaleString():'';
    const act=o.status==='done'||o.status==='failed'||o.status==='cancelled'
      ?`<button class="btn" onclick="retry('${o.id}')">重试</button>`
      :`<button class="btn" onclick="cancel('${o.id}')">取消</button>`;
    return `<tr>
      <td><code>${esc(o.id)}</code><br><span class="hint">${esc(o.title)}</span></td>
      <td><span class="wo-status st-${esc(o.status)}">${ST_LABEL[o.status]||esc(o.status)}</span>
        <br><span class="hint">重试 ${o.tries}/${o.retries}</span></td>
      <td class="wo-note" title="${esc(o.note)}">${esc(o.note)||'—'}</td>
      <td class="hint">${time}</td>
      <td>${act}</td>
    </tr>`;
  }).join('');
  const st=(_snap&&_snap.stats)||{};
  box.innerHTML=`<div class="hint" style="margin-bottom:8px">排队 ${st.queued||0} · 执行中 ${st.dispatched||0} · 完成 ${st.done||0} · 失败 ${st.failed||0}</div>
    <table class="wo-table"><thead><tr><th>工单</th><th>状态</th><th>备注</th><th>时间</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function enqueue(){
  const title=(document.getElementById('wo-title').value||'').trim();
  const prompt=(document.getElementById('wo-prompt').value||'').trim();
  if(!title||!prompt){showToast('标题和指令都要填','error');return;}
  const watch=(document.getElementById('wo-watch').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const body={
    title, prompt, watch,
    verify_cmd:(document.getElementById('wo-verify').value||'').trim(),
    cwd:(document.getElementById('wo-cwd').value||'').trim(),
    retries:parseInt(document.getElementById('wo-retries').value||'0',10)||0,
  };
  try{
    await api('POST','/burner/enqueue',body);
    showToast('已入队','success');
    document.getElementById('wo-title').value='';
    document.getElementById('wo-prompt').value='';
    await load();
  }catch(e){showToast('入队失败: '+e.message,'error');}
}

async function dispatchNow(){
  try{
    const r=await api('POST','/burner/dispatch-now',{});
    showToast(r.action==='dispatched'?('已派单: '+(r.title||r.id||'')):('未派单: '+(r.reason||r.action)),'info');
    await load();
  }catch(e){showToast('派单失败: '+e.message,'error');}
}

async function cancel(id){
  if(!confirm('取消工单 '+id+'？'))return;
  try{await api('POST','/burner/order/'+id+'/cancel',{});showToast('已取消','success');await load();}
  catch(e){showToast('失败: '+e.message,'error');}
}

async function retry(id){
  try{await api('POST','/burner/order/'+id+'/retry',{});showToast('已重置为排队','success');await load();}
  catch(e){showToast('失败: '+e.message,'error');}
}

async function clearDone(){
  try{const r=await api('POST','/burner/clear-done',{});showToast('已清理 '+r.removed+' 条','success');await load();}
  catch(e){showToast('失败: '+e.message,'error');}
}
</script>
</body>
</html>
